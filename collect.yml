name: Collect DB delay data

on:
  schedule:
    # 每15分钟跑一次（UTC时间，注意跟本地时间有时差，德国夏令时是UTC+2，冬令时UTC+1）
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # 允许在GitHub网页上手动点一下立即跑一次，方便测试

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行采集脚本
        env:
          DB_CLIENT_ID: ${{ secrets.DB_CLIENT_ID }}
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
        run: python collect.py

      - name: 提交更新后的数据库文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.db
          git diff --staged --quiet || git commit -m "自动采集数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
